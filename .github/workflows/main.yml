name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: day-01-magnetic-button/package-lock.json

      - name: Prepare root dist
        run: |
          rm -rf dist
          mkdir -p dist/day-01-magnetic-button dist/day-02-cursor-playground

      - name: Install dependencies
        working-directory: day-01-magnetic-button
        run: npm ci

      - name: Build Day 01
        working-directory: day-01-magnetic-button
        run: npm run build -- --base=/30-day-vibe-coding/day-01-magnetic-button/

      - name: Copy Day 01 into root dist
        run: cp -R day-01-magnetic-button/dist/. dist/day-01-magnetic-button/

      - name: Create root dist/index.html
        run: |
          cat > dist/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta http-equiv="refresh" content="0; url=./day-01-magnetic-button/" />
            <title>Day 01 — Magnetic Button</title>
            <script>location.replace("./day-01-magnetic-button/");</script>
          </head>
          <body>
            <p><a href="./day-01-magnetic-button/">Continue to Day 01</a></p>
          </body>
          </html>
          EOF
          
      - name: Copy Day 02 into root dist
        run: cp day-02-cursor-playground/index.html dist/day-02-cursor-playground/index.html

      - name: Copy Day 03 into root dist
        run: mkdir -p "dist/day-03-Liquid Toggle" && cp "day-03-Liquid Toggle/index.html" "dist/day-03-Liquid Toggle/index.html"

      - name: Print final dist structure
        run: find dist -maxdepth 4 -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
