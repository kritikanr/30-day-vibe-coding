name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: day-01-magnetic-button/package-lock.json

      - name: Prepare root dist
        run: |
          rm -rf dist
          mkdir -p dist/day-01-magnetic-button dist/day-02-cursor-playground

      - name: Install dependencies
        working-directory: day-01-magnetic-button
        run: npm ci

      - name: Build Day 01
        working-directory: day-01-magnetic-button
        run: npm run build -- --base=/30-day-vibe-coding/day-01-magnetic-button/

      - name: Copy Day 01 into root dist
        run: cp -R day-01-magnetic-button/dist/. dist/day-01-magnetic-button/

      - name: Copy Day 02 into root dist
        run: cp day-02-cursor-playground/index.html dist/day-02-cursor-playground/index.html

      - name: Print final dist structure
        run: find dist -maxdepth 3 -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
