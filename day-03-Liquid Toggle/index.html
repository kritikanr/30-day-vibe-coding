<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particle Toggle</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(120% 90% at 50% 0%, #121218 0%, #08080A 70%);
  }
  a { color: #A78BFA; }
  a:hover { color: #C4B5FD; }

  .pt-stage {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 48px 24px;
    box-sizing: border-box;
  }

  /* light-mode ground, crossfaded over the dark body background */
  .pt-light {
    position: fixed;
    inset: 0;
    background: radial-gradient(120% 90% at 50% 0%, #FFFFFF 0%, #F5F6FA 70%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 760ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  .pt-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  /* 1px glass rim */
  .pt-rim {
    padding: 1px;
    border-radius: 31px;
    background: linear-gradient(160deg,
      rgba(255,255,255,0.30) 0%,
      rgba(255,255,255,0.07) 30%,
      rgba(255,255,255,0.02) 55%,
      rgba(255,255,255,0.10) 100%);
    box-shadow: 0 18px 38px -20px rgba(0,0,0,0.9), 0 2px 6px -2px rgba(0,0,0,0.5);
    transition: box-shadow 760ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .pt-rim.is-light {
    box-shadow: 0 16px 32px -18px rgba(16,24,32,0.40), 0 2px 6px -2px rgba(16,24,32,0.14);
  }

  .pt-switch {
    display: block;
    position: relative;
    width: 182px;
    height: 60px;
    padding: 0;
    border: 0;
    border-radius: 30px;
    cursor: pointer;
    outline: none;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    background: linear-gradient(165deg,
      rgba(28,32,38,0.62) 0%,
      rgba(10,12,16,0.78) 55%,
      rgba(6,7,10,0.86) 100%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    backdrop-filter: blur(18px) saturate(150%);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.10),
      inset 0 -1px 1px rgba(0,0,0,0.6),
      inset 0 0 26px rgba(0,0,0,0.55);
  }
  .pt-switch:focus-visible {
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.10),
      inset 0 -1px 1px rgba(0,0,0,0.6),
      inset 0 0 26px rgba(0,0,0,0.55),
      0 0 0 3px rgba(255,255,255,0.26);
  }

  .pt-canvas {
    position: absolute;
    inset: 0;
    width: 182px;
    height: 60px;
    display: block;
  }

  /* specular highlight along the top edge */
  .pt-spec {
    position: absolute;
    left: 6px; right: 6px; top: 1px;
    height: 22px;
    border-radius: 30px 30px 60px 60px / 22px 22px 40px 40px;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.16) 0%,
      rgba(255,255,255,0.05) 45%,
      rgba(255,255,255,0) 100%);
    pointer-events: none;
  }
  /* hairline inner edge */
  .pt-edge {
    position: absolute;
    inset: 0;
    border-radius: 30px;
    box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.09);
    pointer-events: none;
  }

  .pt-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6B7280;
  }
</style>
</head>
<body>

<div class="pt-stage">
  <div class="pt-light" id="ptLight"></div>

  <div class="pt-wrap">
    <div class="pt-rim" id="ptRim">
      <button type="button" class="pt-switch" id="ptSwitch" role="switch" aria-checked="false" aria-label="Appearance">
        <canvas class="pt-canvas" id="ptCanvas" width="182" height="60"></canvas>
        <span class="pt-spec"></span>
        <span class="pt-edge"></span>
      </button>
    </div>
    <div class="pt-label"><span id="ptLabel">Dark</span></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---- configuration ------------------------------------------------------
  var PARTICLE_COUNT = 1350;   // particles in the single persistent population
  var DURATION_MS    = 760;    // full dissolve -> travel -> converge cycle
  var HUE_STOPS      = [[255,111,181],[255,197,61],[79,141,255],[168,85,247]]; // pink, yellow, blue, purple
  var HUES  = 24;              // interpolated steps around the hue loop
  var STEPS = 10;              // white -> hue ramp resolution

  // ---- geometry -----------------------------------------------------------
  var W = 182, H = 60, R = 20.5;
  var cxL = 31, cxR = 151, cy = 30;

  var canvas = document.getElementById('ptCanvas');
  var btn    = document.getElementById('ptSwitch');
  var light  = document.getElementById('ptLight');
  var rim    = document.getElementById('ptRim');
  var label  = document.getElementById('ptLabel');
  var ctx    = canvas.getContext('2d');

  var on = false;           // false = dark, true = light
  var particles = [];
  var sprites = [];
  var gColor = 0;           // 0 = white, 1 = fully coloured
  var colorFrom = 0;
  var tStart = null;        // transition start timestamp, null when at rest
  var raf = null;

  // ---- hi-dpi sizing ------------------------------------------------------
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ---- particle sprites: [hue][white->hue step] ---------------------------
  function makeSprite(col) {
    var r = col.map(function (v) {
      return Math.round(Math.max(0, Math.min(255, v)));
    }).join(',');
    var sz = 16;
    var cv = document.createElement('canvas');
    cv.width = sz; cv.height = sz;
    var g = cv.getContext('2d');
    var grd = g.createRadialGradient(sz / 2, sz / 2, 0, sz / 2, sz / 2, sz / 2);
    grd.addColorStop(0,    'rgba(' + r + ',1)');
    grd.addColorStop(0.35, 'rgba(' + r + ',0.62)');
    grd.addColorStop(0.72, 'rgba(' + r + ',0.16)');
    grd.addColorStop(1,    'rgba(' + r + ',0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, sz, sz);
    return cv;
  }

  function buildSprites() {
    sprites = [];
    for (var h = 0; h < HUES; h++) {
      var f  = (h / HUES) * HUE_STOPS.length;
      var i0 = Math.floor(f) % HUE_STOPS.length;
      var i1 = (i0 + 1) % HUE_STOPS.length;
      var k  = f - Math.floor(f);
      var end  = [0,1,2].map(function (j) {
        return HUE_STOPS[i0][j] + (HUE_STOPS[i1][j] - HUE_STOPS[i0][j]) * k;
      });
      var pale = [0,1,2].map(function (j) { return 255 + (end[j] - 255) * 0.28; });

      var ramp = [];
      for (var s = 0; s < STEPS; s++) {
        var t = s / (STEPS - 1);
        var col = t < 0.5
          ? [0,1,2].map(function (j) { return 255 + (pale[j] - 255) * (t / 0.5); })
          : [0,1,2].map(function (j) { return pale[j] + (end[j] - pale[j]) * ((t - 0.5) / 0.5); });
        ramp.push(makeSprite(col));
      }
      sprites.push(ramp);
    }
  }

  // ---- one persistent particle population ---------------------------------
  function initParticles() {
    var N = Math.max(200, Math.min(3000, PARTICLE_COUNT));
    particles = [];
    for (var i = 0; i < N; i++) {
      // uniform direction on the unit sphere
      var uz = Math.random() * 2 - 1;
      var th = Math.random() * Math.PI * 2;
      var sp = Math.sqrt(1 - uz * uz);
      var ux = sp * Math.cos(th), uy = sp * Math.sin(th);

      var fringe = Math.random() < 0.09;
      var rad = R * Math.pow(Math.random(), 1 / 3);
      if (fringe) rad = R * (1.0 + Math.random() * 0.34);
      var depth = (uz + 1) / 2;

      particles.push({
        ux: ux, uy: uy, uz: uz, rad: rad,
        size: (0.5 + Math.random() * 0.75) * (0.72 + 0.38 * depth) * (fringe ? 0.7 : 1),
        a:    (0.20 + Math.random() * 0.62) * (0.5 + 0.5 * depth) * (fringe ? 0.45 : 1),
        ph:  Math.random() * Math.PI * 2,
        ph2: Math.random() * Math.PI * 2,
        jx: (Math.random() - 0.5) * 16,   // lateral scatter during travel
        jy: (Math.random() - 0.5) * 13,   // vertical scatter during travel
        rnd:  Math.random(),
        rnd2: Math.random(),
        x: 0, y: 0, sx: 0, sy: 0,
        delay: 0, dur: 1
      });
    }
    var cx = on ? cxR : cxL;
    for (var n = 0; n < particles.length; n++) {
      var p = particles[n];
      p.x = cx + p.ux * p.rad;
      p.y = cy + p.uy * p.rad;
      p.sx = p.x; p.sy = p.y;
    }
  }

  // ---- theme crossfade ----------------------------------------------------
  function syncTheme() {
    light.style.transition = 'opacity ' + DURATION_MS + 'ms cubic-bezier(0.4, 0, 0.2, 1)';
    light.style.opacity = on ? '1' : '0';
    rim.style.transition = 'box-shadow ' + DURATION_MS + 'ms cubic-bezier(0.4, 0, 0.2, 1)';
    rim.classList.toggle('is-light', on);
    btn.setAttribute('aria-checked', on ? 'true' : 'false');
    label.textContent = on ? 'Light' : 'Dark';
  }

  // ---- toggle: re-source every particle from its live position ------------
  function toggle() {
    on = !on;
    var dirSign = on ? 1 : -1;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.sx = p.x; p.sy = p.y;
      var lead = (p.ux * dirSign + 1) / 2;        // 1 = already facing travel direction
      p.delay = (1 - lead) * 0.26 + p.rnd * 0.11; // leading particles leave first
      p.dur = Math.min(1 - p.delay, 0.56 + p.rnd2 * 0.24);
    }
    colorFrom = gColor;
    tStart = performance.now();
    syncTheme();
  }

  // ---- render loop --------------------------------------------------------
  function loop(now) {
    raf = requestAnimationFrame(loop);
    if (!ctx || !particles.length || !sprites.length) return;

    var flying = tStart !== null;
    var T = flying ? Math.min(1, (now - tStart) / DURATION_MS) : 1;
    var target = on ? 1 : 0;
    var sm = T * T * (3 - 2 * T);
    gColor = colorFrom + (target - colorFrom) * sm;

    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    var cxD = on ? cxR : cxL;
    var NS = STEPS - 1;
    var hueBase = (now * 0.00013) * HUES;   // ~32s loop through pink/yellow/blue/purple
    var tt = now * 0.001;

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];

      // live resting position — the orb is continuously deformed, never a fixed sphere
      var def = 1
        + 0.26 * Math.sin(tt * 1.15 + p.ux * 2.3 + p.uz * 1.4)
        + 0.20 * Math.sin(tt * 1.72 + p.uy * 2.9 - p.ux * 1.6)
        + 0.14 * Math.sin(tt * 2.43 + p.uz * 3.2 + p.ph);
      if (def < 0.45) def = 0.45;
      var rr = p.rad * def;
      if (rr > 26.5) rr = 26.5;

      var ang = 0.40 * Math.sin(tt * 0.85 + p.uz * 1.8) + 0.22 * Math.sin(tt * 1.4 + p.uy * 2.2);
      var ca = Math.cos(ang), sa = Math.sin(ang);
      var dx = cxD + (p.ux * ca - p.uy * sa) * rr * 1.06;
      var dy = cy  + (p.ux * sa + p.uy * ca) * rr * 0.94;

      var x, y, aMul = 1, sMul = 1, ct = gColor, restMix = 1;

      if (flying) {
        var e0 = Math.max(0, Math.min(1, (T - p.delay) / p.dur));
        // easeInOutCubic — momentum in, deceleration out, no overshoot
        var e = e0 < 0.5 ? 4 * e0 * e0 * e0 : 1 - Math.pow(-2 * e0 + 2, 3) / 2;
        var mid = Math.sin(Math.PI * e0);

        x = p.sx + (dx - p.sx) * e + p.jx * mid * 0.55;
        y = p.sy + (dy - p.sy) * e;
        y += (cy - y) * 0.52 * mid + p.jy * mid;  // field compresses toward the centreline mid-flight

        sMul = 1 - 0.20 * mid;
        aMul = 1 - 0.10 * mid;
        ct = gColor + (e - 0.5) * 0.14;           // per-particle colour lead/lag
        restMix = e * e;                          // idle drift fades back in on arrival
      } else {
        x = dx; y = dy;
      }

      // idle motion
      x += Math.sin(now * 0.0013 + p.ph * 2.1) * 1.3 * (0.5 + 0.5 * p.rnd)  * restMix;
      y += Math.cos(now * 0.0016 + p.ph * 1.4) * 1.1 * (0.5 + 0.5 * p.rnd2) * restMix;
      x += Math.sin(now * 0.0021 + p.ph) * 0.45;
      y += Math.cos(now * 0.0026 + p.ph * 1.7) * 0.4;
      p.x = x; p.y = y;

      var alpha = p.a * (0.66 + 0.34 * Math.sin(now * 0.0031 + p.ph2)) * aMul;
      var idx = Math.max(0, Math.min(NS, Math.round((ct + (p.rnd - 0.5) * 0.14) * NS)));
      var hi = Math.round(hueBase + p.rnd2 * 2.2 + p.uz * 1.1) % HUES;
      if (hi < 0) hi += HUES;

      var s = p.size * sMul * 1.9;
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
      ctx.drawImage(sprites[hi][idx], x - s, y - s, s * 2, s * 2);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    if (flying && T >= 1) tStart = null;
  }

  // ---- boot ---------------------------------------------------------------
  function start() {
    if (raf) cancelAnimationFrame(raf);
    resize();
    buildSprites();
    initParticles();
    gColor = on ? 1 : 0;
    colorFrom = gColor;
    tStart = null;
    syncTheme();
    raf = requestAnimationFrame(loop);
  }

  btn.addEventListener('click', toggle);   // Enter/Space fire click on a <button>
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      if (raf) { cancelAnimationFrame(raf); raf = null; }
    } else if (!raf) {
      raf = requestAnimationFrame(loop);
    }
  });

  start();
})();
</script>

</body>
</html>
